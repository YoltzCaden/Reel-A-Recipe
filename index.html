<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reel-A-Recipe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="section">
      <h1>My Recipes</h1>
      <h2>Recipes</h2>
      <form id="recipe-form" class="item-form">
        <input type="text" id="recipe-input" placeholder="Egg Fried Rice">
        <button type="submit">Add Recipe</button>
      </form>
      <ul id="recipe-list"></ul>
    </div>  
    <div class="section">  
      <h2 id="pantry-heading">Pantry</h2>
      <form id="pantry-form" class="item-form">
        <input type="text" id="pantry-input" placeholder="eg. Eggs">
        <button type="submit">Add pantry item</button>
      </form>
      <ul id="pantry-list"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
